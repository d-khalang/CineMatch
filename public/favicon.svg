  <line x1="66" y1="40" x2="66" y2="46" stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round" />
  <circle cx="66" cy="39" r="2.2" fill="#F59E0B" />
  <rect x="55" y="46" width="22" height="16" rx="5" fill="#0A0F1D" stroke="#F59E0B" stroke-width="2.6" />
  <rect x="52" y="50.5" width="3" height="7" rx="1.5" fill="#F59E0B" />
  <rect x="77" y="50.5" width="3" height="7" rx="1.5" fill="#F59E0B" />
  <rect x="62" y="62" width="8" height="3" rx="1" fill="#F59E0B" opacity="0.8" />
  <path d="M50 77 C52 70, 58 66, 66 66 C75 66, 83 70, 84 88 L50 88 Z" fill="#0A0F1D" stroke="#F59E0B" stroke-width="2.6" stroke-linejoin="round" />

