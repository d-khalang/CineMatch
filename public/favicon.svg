<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cmFaviconScreen" x1="20" y1="12" x2="80" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="cmFaviconBeam" x1="50" y1="46" x2="50" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Ambient Light Projection -->
  <polygon points="18,48 82,48 96,88 4,88" fill="url(#cmFaviconBeam)" />

  <!-- TV / Cinema Screen -->
  <rect x="18" y="10" width="64" height="38" rx="6" fill="#070A12" stroke="#38BDF8" stroke-width="2.5" />
  <rect x="21" y="13" width="58" height="32" rx="3.5" fill="url(#cmFaviconScreen)" />
  <circle cx="50" cy="29" r="5" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="2.5 1.5" fill="none" opacity="0.9" />
  <circle cx="50" cy="29" r="1.8" fill="#FFFFFF" />

  <!-- TV Stand -->
  <path d="M44 48 L56 48 M50 48 L50 53 M43 53 L57 53" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" opacity="0.5" />

  <!-- Human (Left) -->
  <circle cx="36" cy="55" r="9.5" fill="#0A0F1D" stroke="#38BDF8" stroke-width="2.6" />
  <path d="M16 88 C16 73, 24 66, 36 66 C45 66, 49 71, 50 77 L50 88 Z" fill="#0A0F1D" stroke="#38BDF8" stroke-width="2.6" stroke-linejoin="round" />

